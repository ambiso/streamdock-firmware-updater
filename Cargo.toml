[package]
name = "streamdock-firmware-updater"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/ambiso/streamdock-firmware-updater"
publish = false

[[bin]]
name = "streamdock-fw"
path = "src/main.rs"

[dependencies]
async-hid = { version = "=0.5.3", default-features = false, features = ["tokio", "win32"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-lite = "2"
md-5 = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
